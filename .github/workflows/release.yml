name: GitHub Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    name: Create GitHub Release
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release from checked-in notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "pi-glance ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes" \
            --latest
