name: Validate

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Pi ${{ matrix.pi-version }} / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.19.0"
          - "24.x"
        pi-version:
          - "0.86.1"
          - "1.0.0"
    env:
      PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-glance-agent
      PI_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install compatibility SDK without changing the lockfile
        if: matrix.pi-version != '0.86.1'
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          "@earendil-works/pi-ai@$PI_VERSION"
          "@earendil-works/pi-coding-agent@$PI_VERSION"
          "@earendil-works/pi-tui@$PI_VERSION"

      - name: Verify SDK versions and unchanged manifests
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: |
          node --input-type=module <<'NODE'
          import { strict as assert } from 'node:assert';
          import { readFileSync } from 'node:fs';
          for (const name of ['pi-ai', 'pi-coding-agent', 'pi-tui']) {
            const { version } = JSON.parse(readFileSync(`node_modules/@earendil-works/${name}/package.json`, 'utf8'));
            assert.equal(version, process.env.PI_VERSION, name);
            console.log(`${name}@${version}`);
          }
          NODE
          git diff --exit-code -- package.json package-lock.json

      - name: Typecheck
        run: npm run check

      # Includes the npm pack file-tree contract and architecture checks.
      - name: Test behavior and package contents
        run: npm test
